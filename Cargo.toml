[workspace]
members = ["crates/splitcard-core", "crates/splitcard-wasm", "crates/splitcard-ln", "crates/splitcard-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/splitcard"

[workspace.dependencies]
axum = "0.8"
futures = "0.3"
hex = "0.4"
lightning-invoice = "0.34.1"
proptest = "1"
# rustls only: no native-tls, no system proxy.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
