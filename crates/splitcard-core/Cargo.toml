[package]
name = "splitcard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `std` is the only feature needed for event-id and Schnorr verification.
nostr = { version = "0.45.5", default-features = false, features = ["std"] }

[dev-dependencies]
proptest.workspace = true
# Only used in tests for a signing context; same version nostr depends on.
secp256k1 = { version = "0.30", default-features = false, features = ["alloc"] }
