[package]
name = "splitcard-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
splitcard-core = { path = "../splitcard-core" }
wasm-bindgen.workspace = true

# Native-only: the fixture generator signs events with fixed keys, using the
# same nostr and secp256k1 versions splitcard-core depends on.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
nostr = { version = "0.45.5", default-features = false, features = ["std"] }
secp256k1 = { version = "0.30", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
